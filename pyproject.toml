[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beancount-paypal-ng"
version = "0.1.0"
description = "Beangulp-compatible Beancount Importer for PayPal CSV exports (fork of beancount-paypal)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Omar Kohl", email = "omarkohl@posteo.net" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "beancount",
    "beangulp",
]
requires-python = ">=3.8"

[project.urls]
Source = "https://github.com/omarkohl/beancount-paypal-ng"

[tool.hatch.build.targets.wheel]
packages = ["beancount_paypal"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=7.0.0",
]
